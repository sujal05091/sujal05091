<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 32" fill="none">

  <defs>
    <linearGradient id="pillGradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF474E" />
    </linearGradient>
  </defs>
  <g font-family="system-ui, -apple-system, 'SF Mono', 'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="0.8">

    <!-- FastAPI -->
    <g transform="translate(0, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#009688" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">⚡</text>
      <rect x="33" y="0" width="83.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="74.75" y="19" text-anchor="middle" fill="#050608">FASTAPI</text>
    </g>
    <!-- Flask -->
    <g transform="translate(127.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">FL</text>
      <rect x="33" y="0" width="66.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="66.25" y="19" text-anchor="middle" fill="#050608">FLASK</text>
    </g>
    <!-- REST APIs -->
    <g transform="translate(238, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#FFB703" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900">API</text>
      <rect x="33" y="0" width="100.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="83.25" y="19" text-anchor="middle" fill="#050608">REST APIS</text>
    </g>
    <!-- Node.js -->
    <g transform="translate(382.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#339933" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">JS</text>
      <rect x="33" y="0" width="83.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="74.75" y="19" text-anchor="middle" fill="#050608">NODE.JS</text>
    </g>
    <!-- Express -->
    <g transform="translate(510, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">EX</text>
      <rect x="33" y="0" width="83.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="74.75" y="19" text-anchor="middle" fill="#050608">EXPRESS</text>
    </g>
    <!-- Spring Boot -->
    <g transform="translate(637.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#6DB33F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">SB</text>
      <rect x="33" y="0" width="117.5" height="30" rx="3" fill="url(#pillGradRed)" />
