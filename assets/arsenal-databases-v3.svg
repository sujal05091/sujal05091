<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 32" fill="none">

  <defs>
    <linearGradient id="pillGradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF474E" />
    </linearGradient>
  </defs>
  <g font-family="system-ui, -apple-system, 'SF Mono', 'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="0.8">

    <!-- PostgreSQL -->
    <g transform="translate(0, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#4169E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">PG</text>
      <rect x="33" y="0" width="109" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="87.5" y="19" text-anchor="middle" fill="#050608">POSTGRESQL</text>
    </g>
    <!-- MongoDB -->
    <g transform="translate(153, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#47A248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">MG</text>
      <rect x="33" y="0" width="83.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="74.75" y="19" text-anchor="middle" fill="#050608">MONGODB</text>
    </g>
    <!-- Supabase -->
    <g transform="translate(280.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#3ECF8E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">SB</text>
      <rect x="33" y="0" width="92" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="79" y="19" text-anchor="middle" fill="#050608">SUPABASE</text>
    </g>
    <!-- Firebase -->
    <g transform="translate(416.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#FFCA28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">FB</text>
      <rect x="33" y="0" width="92" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="79" y="19" text-anchor="middle" fill="#050608">FIREBASE</text>
    </g>
    <!-- AWS S3 -->
    <g transform="translate(552.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#FF9900" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">S3</text>
      <rect x="33" y="0" width="75" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="70.5" y="19" text-anchor="middle" fill="#050608">AWS S3</text>
    </g>
    <!-- Cloud Run -->
    <g transform="translate(671.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#4285F4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">CR</text>
      <rect x="33" y="0" width="100.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="83.25" y="19" text-anchor="middle" fill="#050608">CLOUD RUN</text>
    </g>
    <!-- ChromaDB -->
    <g transform="translate(816, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#A855F7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">CH</text>
      <rect x="33" y="0" width="92" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="79" y="19" text-anchor="middle" fill="#050608">CHROMADB</text>
    </g>
