    <text x="40" y="18" font-family="'Orbitron', sans-serif" font-size="10" font-weight="900" fill="#F4F4F2" letter-spacing="0.5">COMEDKARES &amp; REVA</text>
    <text x="40" y="30" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#55E6FF">INNOVATION &amp; DESIGN</text>
    <line x1="12" y1="42" x2="258" y2="42" stroke="#1E2838" stroke-width="0.8" />
    <text x="12" y="60" font-family="'Courier New', monospace" font-size="8.5" fill="#C5CAD4">COMEDKARES: 2nd Runner Up</text>
    <text x="12" y="74" font-family="'Courier New', monospace" font-size="8.5" fill="#A8ADB7">REVA Univ: Best Animation Award</text>
