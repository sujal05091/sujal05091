  <g transform="translate(620, 198)">
    <rect width="270" height="110" rx="6" fill="#0C1018" stroke="#1E2838" stroke-width="1.2" />
    <rect width="270" height="110" rx="6" fill="none" stroke="#222834" stroke-width="1" />
    <circle cx="22" cy="22" r="10" fill="#101D14" stroke="#10B981" stroke-width="1" />
    <text x="22" y="26" text-anchor="middle" font-size="12">🛡️</text>
    <text x="40" y="18" font-family="'Orbitron', sans-serif" font-size="10" font-weight="900" fill="#F4F4F2" letter-spacing="0.5">CYBER SECURITY BOOTCAMP</text>
    <text x="40" y="30" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#10B981">CYSECK // NITK SURATHKAL</text>
    <line x1="12" y1="42" x2="258" y2="42" stroke="#1E2838" stroke-width="0.8" />
    <text x="12" y="60" font-family="'Courier New', monospace" font-size="8.5" fill="#C5CAD4">Security Architecture &amp; Audit</text>
    <text x="12" y="74" font-family="'Courier New', monospace" font-size="8.5" fill="#A8ADB7">IBM SkillsBuild AI Literacy</text>
    <rect x="12" y="86" width="125" height="16" rx="2" fill="#0E1C14" />
    <text x="74" y="97" text-anchor="middle" font-family="'Courier New', monospace" font-size="7.5" font-weight="800" fill="#34D399">CYSECK CERTIFIED</text>
