    <text x="40" y="18" font-family="'Orbitron', sans-serif" font-size="10" font-weight="900" fill="#F4F4F2" letter-spacing="0.5">NPTEL ELITE // IOT</text>
    <text x="40" y="30" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#FFB703">IIT / MHRD INDIA</text>
    <line x1="12" y1="42" x2="258" y2="42" stroke="#1E2838" stroke-width="0.8" />
    <text x="12" y="60" font-family="'Courier New', monospace" font-size="8.5" fill="#C5CAD4">Internet of Things Engineering</text>
    <text x="12" y="74" font-family="'Courier New', monospace" font-size="8.5" fill="#A8ADB7">Elite Certification Honor</text>
    <rect x="12" y="86" width="115" height="16" rx="2" fill="#1F1708" />
    <text x="69" y="97" text-anchor="middle" font-family="'Courier New', monospace" font-size="7.5" font-weight="800" fill="#FBBF24">NPTEL ELITE GRADE</text>
  </g>

