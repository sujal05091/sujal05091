<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 32" fill="none">

  <defs>
    <linearGradient id="pillGradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF474E" />
    </linearGradient>
  </defs>
  <g font-family="system-ui, -apple-system, 'SF Mono', 'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="0.8">

    <!-- TensorFlow -->
    <g transform="translate(0, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#FF6F00" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">TF</text>
      <rect x="33" y="0" width="109" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="87.5" y="19" text-anchor="middle" fill="#050608">TENSORFLOW</text>
    </g>
    <!-- PyTorch -->
    <g transform="translate(153, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#EE4C2C" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">PT</text>
      <rect x="33" y="0" width="83.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="74.75" y="19" text-anchor="middle" fill="#050608">PYTORCH</text>
    </g>
    <!-- Scikit-Learn -->
    <g transform="translate(280.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#F7931E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">SK</text>
      <rect x="33" y="0" width="126" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="96" y="19" text-anchor="middle" fill="#050608">SCIKIT-LEARN</text>
    </g>
    <!-- OpenCV -->
    <g transform="translate(450.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#5C3EE8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">CV</text>
      <rect x="33" y="0" width="75" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="70.5" y="19" text-anchor="middle" fill="#050608">OPENCV</text>
    </g>
    <!-- MediaPipe -->
    <g transform="translate(569.5, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#00C853" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">MP</text>
      <rect x="33" y="0" width="100.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="83.25" y="19" text-anchor="middle" fill="#050608">MEDIAPIPE</text>
    </g>
    <!-- Keras -->
    <g transform="translate(714, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="15" y="20" text-anchor="middle" fill="#D00000" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">K</text>
      <rect x="33" y="0" width="66.5" height="30" rx="3" fill="url(#pillGradRed)" />
      <text x="66.25" y="19" text-anchor="middle" fill="#050608">KERAS</text>
    </g>
  </g>
</svg>