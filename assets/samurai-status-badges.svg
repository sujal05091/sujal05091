<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 34" fill="none">
  <defs>
    <linearGradient id="badgeRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="badgeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
  </defs>

  <g transform="translate(6, 1)" font-family="system-ui, -apple-system, 'SF Mono', 'Courier New', monospace" font-size="10.5" font-weight="900" letter-spacing="0.8">
    <!-- 01: IDENTITY -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="35" y="20" text-anchor="middle" fill="#A8ADB7" font-size="9.5">OPERATIVE</text>
      <rect x="73" y="0" width="124" height="32" rx="3" fill="url(#badgeRed)" />
      <text x="135" y="20" text-anchor="middle" fill="#FFFFFF">SUJAL S KUMAR</text>
    </g>

    <!-- 02: CALLSIGN -->
    <g transform="translate(209, 0)">
