      <text x="108" y="20" text-anchor="middle" fill="#050608">★★★★★ 5-STAR</text>
    </g>

    <!-- 04: CS2 RANK -->
    <g transform="translate(563, 0)">
      <rect x="0" y="0" width="45" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="22.5" y="20" text-anchor="middle" fill="#A8ADB7" font-size="9.5">CS2</text>
