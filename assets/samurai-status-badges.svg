<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 34" fill="none">
  <defs>
    <linearGradient id="statusPillRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF474E" />
    </linearGradient>
    <linearGradient id="statusPillGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="statusPillCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55E6FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
  </defs>

  <g transform="translate(6, 1)" font-family="system-ui, -apple-system, 'SF Mono', 'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="0.8">
    <!-- 01: IDENTITY -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="35" y="20" text-anchor="middle" fill="#A8ADB7" font-size="10">IDENTITY</text>
      <rect x="73" y="0" width="124" height="32" rx="3" fill="url(#statusPillRed)" />
      <text x="135" y="20" text-anchor="middle" fill="#050608">SUJAL S KUMAR</text>
    </g>

    <!-- 02: CODENAME -->
    <g transform="translate(209, 0)">
      <rect x="0" y="0" width="74" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="37" y="20" text-anchor="middle" fill="#A8ADB7" font-size="10">CODENAME</text>
      <rect x="77" y="0" width="98" height="32" rx="3" fill="url(#statusPillRed)" />
      <text x="126" y="20" text-anchor="middle" fill="#050608">SUJAL05091</text>
    </g>

    <!-- 03: STATUS -->
    <g transform="translate(396, 0)">
      <rect x="0" y="0" width="72" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <circle cx="14" cy="16" r="3.5" fill="#10B981" />
      <text x="44" y="20" text-anchor="middle" fill="#A8ADB7" font-size="10">STATUS</text>
      <rect x="75" y="0" width="76" height="32" rx="3" fill="url(#statusPillGreen)" />
      <text x="113" y="20" text-anchor="middle" fill="#050608">ONLINE</text>
    </g>

    <!-- 04: HQ -->
    <g transform="translate(559, 0)">
      <rect x="0" y="0" width="36" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="18" y="20" text-anchor="middle" fill="#A8ADB7" font-size="10">HQ</text>
      <rect x="39" y="0" width="82" height="32" rx="3" fill="url(#statusPillRed)" />
      <text x="80" y="20" text-anchor="middle" fill="#050608">UDUPI, IN</text>
    </g>

    <!-- 05: CADENCE -->
    <g transform="translate(692, 0)">
      <rect x="0" y="0" width="70" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="35" y="20" text-anchor="middle" fill="#A8ADB7" font-size="10">CADENCE</text>
      <rect x="73" y="0" width="70" height="32" rx="3" fill="url(#statusPillCyan)" />
      <text x="108" y="20" text-anchor="middle" fill="#050608">ACTIVE</text>
    </g>
  </g>
</svg>