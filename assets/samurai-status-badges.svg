      <text x="34" y="20" text-anchor="middle" fill="#A8ADB7" font-size="9.5">CALLSIGN</text>
      <rect x="71" y="0" width="108" height="32" rx="3" fill="#141926" stroke="#00F5D4" stroke-width="1" />
      <text x="125" y="20" text-anchor="middle" fill="#00F5D4">GHOST // TF-141</text>
    </g>

    <!-- 03: WANTED LEVEL -->
    <g transform="translate(398, 0)">
      <rect x="0" y="0" width="58" height="32" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <text x="29" y="20" text-anchor="middle" fill="#A8ADB7" font-size="9.5">GTA VI</text>
